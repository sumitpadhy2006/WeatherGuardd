<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" className="weatherguard-shield-logo">
  <defs>
    <!-- Background Outer Glow -->
    <filter id="wg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="wg-intense-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shield Gradients -->
    <linearGradient id="wg-shield-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2340" />
      <stop offset="35%" stop-color="#0b172a" />
      <stop offset="70%" stop-color="#050d1a" />
      <stop offset="100%" stop-color="#020710" />
    </linearGradient>

    <linearGradient id="wg-shield-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="wg-shield-border-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Sun Gradients -->
    <radialGradient id="wg-sun" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </radialGradient>

    <radialGradient id="wg-sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Letter WG Monogram Gradients -->
    <linearGradient id="wg-letter-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="wg-letter-bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Orbital Cyan Ring -->
    <linearGradient id="wg-orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="40%" stop-color="#67e8f9" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Earth & Atmosphere -->
    <radialGradient id="wg-earth-ocean" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>

    <!-- Banner Ribbon Gradient -->
    <linearGradient id="wg-ribbon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c1e3d" />
      <stop offset="50%" stop-color="#142c54" />
      <stop offset="100%" stop-color="#0c1e3d" />
    </linearGradient>

    <!-- Clip Path for Shield Interior -->
    <clipPath id="wg-shield-clip">
      <path d="M 250 440 C 130 380 75 300 75 90 L 250 48 L 425 90 C 425 300 370 380 250 440 Z" />
    </clipPath>
  </defs>

  <!-- SHIELD OUTER GLOW & BASE -->
  <path d="M 250 448 C 122 386 67 304 67 86 L 250 42 L 433 86 C 433 304 378 386 250 448 Z"
        fill="#0284c7" opacity="0.4" filter="url(#wg-glow)" />

  <!-- SHIELD BEVELED OUTER BORDER -->
  <path d="M 250 446 C 124 384 70 302 70 88 L 250 44 L 430 88 C 430 302 376 384 250 446 Z"
        fill="url(#wg-shield-border)" stroke="#0c4a6e" stroke-width="2" />

  <!-- SHIELD INNER BORDER -->
  <path d="M 250 440 C 130 380 75 300 75 90 L 250 48 L 425 90 C 425 300 370 380 250 440 Z"
        fill="#08182b" stroke="url(#wg-shield-border-inner)" stroke-width="4" />

  <!-- INTERIOR SCENERY (CLIPPED TO SHIELD) -->
  <g clip-path="url(#wg-shield-clip)">
    <!-- Base Background Split: Left Day/Atmosphere, Right Night/Cosmos -->
    <rect x="70" y="40" width="360" height="410" fill="url(#wg-shield-bg)" />

    <!-- SPACE SECTOR (Upper Right) -->
    <!-- Deep Cosmos Gradient Overlay -->
    <path d="M 250 48 L 425 90 L 425 280 L 250 250 Z" fill="#050b18" opacity="0.85" />

    <!-- Distant Stars & Constellation Specks -->
    <circle cx="390" cy="115" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="340" cy="85" r="2" fill="#bae6fd" opacity="0.8" />
    <circle cx="305" cy="130" r="1.2" fill="#ffffff" opacity="0.7" />
    <circle cx="410" cy="180" r="1.5" fill="#7dd3fc" opacity="0.9" />
    <circle cx="370" cy="220" r="1.8" fill="#ffffff" opacity="0.8" />
    <circle cx="280" cy="100" r="1.2" fill="#fef08a" opacity="0.7" />
    <circle cx="330" cy="165" r="1.5" fill="#ffffff" opacity="0.6" />

    <!-- Crescent Moon (Upper Right) -->
    <g transform="translate(370, 130) rotate(-15)">
      <circle cx="0" cy="0" r="28" fill="#f8fafc" opacity="0.95" filter="url(#wg-glow)" />
      <circle cx="-9" cy="-5" r="25" fill="#071224" />
      <!-- Moon Craters -->
      <circle cx="12" cy="-8" r="3" fill="#cbd5e1" opacity="0.5" />
      <circle cx="16" cy="6" r="4.5" fill="#94a3b8" opacity="0.4" />
      <circle cx="8" cy="16" r="3" fill="#cbd5e1" opacity="0.5" />
    </g>

    <!-- Star Glow Accent -->
    <path d="M 395 110 Q 395 120 405 120 Q 395 120 395 130 Q 395 120 385 120 Q 395 120 395 110 Z" fill="#ffffff" />

    <!-- Shooting Meteor with Fire Streak -->
    <path d="M 420 145 L 350 185" stroke="url(#wg-sun)" stroke-width="3" stroke-linecap="round" filter="url(#wg-glow)" />
    <circle cx="350" cy="185" r="3.5" fill="#ffffff" filter="url(#wg-glow)" />

    <!-- Ringed Planet Saturn (Right Middle) -->
    <g transform="translate(398, 226) rotate(-20)">
      <ellipse cx="0" cy="0" rx="16" ry="4.5" fill="none" stroke="#fde047" stroke-width="2.5" opacity="0.85" />
      <circle cx="0" cy="0" r="8" fill="#d97706" />
      <ellipse cx="0" cy="0" rx="16" ry="4.5" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.9" />
    </g>

    <!-- Orbital Satellite -->
    <g transform="translate(295, 92) rotate(35)">
      <!-- Main Satellite Body -->
      <rect x="-6" y="-4" width="12" height="8" rx="1.5" fill="#e2e8f0" stroke="#0284c7" stroke-width="1" />
      <!-- Solar Panels -->
      <rect x="-20" y="-3" width="12" height="6" fill="#0284c7" stroke="#38bdf8" stroke-width="0.8" />
      <line x1="-14" y1="-3" x2="-14" y2="3" stroke="#e0f2fe" stroke-width="0.5" />
      <rect x="8" y="-3" width="12" height="6" fill="#0284c7" stroke="#38bdf8" stroke-width="0.8" />
      <line x1="14" y1="-3" x2="14" y2="3" stroke="#e0f2fe" stroke-width="0.5" />
      <!-- Antenna -->
      <line x1="0" y1="-4" x2="0" y2="-9" stroke="#94a3b8" stroke-width="1" />
      <circle cx="0" cy="-9" r="1.5" fill="#ef4444" />
    </g>

    <!-- ATMOSPHERE & WEATHER SECTOR (Upper Left) -->
    <!-- Sun Corona Glow -->
    <circle cx="160" cy="130" r="60" fill="url(#wg-sun-glow)" />

    <!-- Sun Corona Rays -->
    <g stroke="url(#wg-sun)" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="160" y1="60" x2="160" y2="45" />
      <line x1="110" y1="80" x2="98" y2="70" />
      <line x1="85" y1="130" x2="70" y2="130" />
      <line x1="110" y1="180" x2="98" y2="190" />
      <line x1="210" y1="80" x2="222" y2="70" />
      <line x1="225" y1="115" x2="240" y2="112" />
    </g>

    <!-- Radiant Golden Sun Sphere -->
    <circle cx="160" cy="130" r="34" fill="url(#wg-sun)" filter="url(#wg-glow)" />

    <!-- Atmospheric Clouds & Cumulus Storm Clouds -->
    <!-- Background Cloud Layer -->
    <path d="M 180 145 Q 200 120 225 130 Q 250 115 275 135 Q 295 145 285 170 Q 240 175 180 170 Z"
          fill="#cbd5e1" opacity="0.6" />

    <!-- White Puffy Cloud Front -->
    <path d="M 130 170 Q 145 140 175 145 Q 200 130 225 150 Q 245 145 255 165 Q 260 185 240 195 Q 180 200 130 190 Q 115 185 130 170 Z"
          fill="#f8fafc" opacity="0.95" filter="url(#wg-glow)" />

    <!-- Storm Rain Cloud (Dark Slate/Blue) -->
    <path d="M 195 175 Q 220 145 245 155 Q 275 140 300 165 Q 315 185 295 210 Q 240 215 195 200 Z"
          fill="#1e293b" opacity="0.85" />

    <!-- Rain Streaks (Angled) -->
    <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.75">
      <line x1="215" y1="205" x2="200" y2="238" />
      <line x1="235" y1="210" x2="220" y2="245" />
      <line x1="255" y1="205" x2="240" y2="240" />
      <line x1="275" y1="212" x2="260" y2="244" />
      <line x1="290" y1="208" x2="278" y2="235" />
    </g>

    <!-- Vivid Electric Lightning Bolt -->
    <path d="M 255 170 L 238 205 L 250 208 L 228 250 L 246 215 L 234 212 Z"
          fill="#67e8f9" stroke="#ffffff" stroke-width="1.5" filter="url(#wg-intense-glow)" />

    <!-- Wind Swirl Streamlines (Left) -->
    <g fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
      <path d="M 85 210 Q 120 210 130 200 Q 138 190 128 184 Q 118 186 122 195" />
      <path d="M 80 228 Q 130 228 145 218 Q 155 206 142 198 Q 132 202 136 212" />
      <path d="M 90 245 Q 125 245 138 238 Q 146 230 138 224 Q 130 226 133 234" />
    </g>

    <!-- EARTH & TERRESTRIAL HORIZON (Lower Sector) -->
    <!-- Left Cyclone Vortex Radar Ring -->
    <g transform="translate(145, 305)" opacity="0.85">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 3" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Spiral Arm -->
      <path d="M -8 -4 Q 0 -12 10 -4 Q 14 6 4 12 Q -8 10 -10 0" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" filter="url(#wg-glow)" />
    </g>

    <!-- Right Seismic & Sensor Radar Waveform -->
    <g transform="translate(355, 305)" opacity="0.85">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 3" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Seismograph Wave Line -->
      <path d="M -18 0 L -8 0 L -5 -8 L -2 10 L 2 -12 L 5 8 L 8 -4 L 11 0 L 18 0"
            fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Mountain Ranges Silhouettes -->
    <!-- Distant Mountains -->
    <polygon points="120,360 180,315 220,340 250,310 280,335 320,305 380,360" fill="#1e3a8a" opacity="0.6" />
    <!-- Snowcaps -->
    <polygon points="180,315 170,324 190,324" fill="#f8fafc" opacity="0.9" />
    <polygon points="250,310 242,318 258,318" fill="#f8fafc" opacity="0.9" />
    <polygon points="320,305 310,316 330,316" fill="#f8fafc" opacity="0.9" />

    <!-- Forefront Mountains with Ridge Lighting -->
    <polygon points="90,380 155,330 210,365 250,335 290,365 345,325 410,380" fill="#0f172a" />
    <polygon points="155,330 146,340 164,340" fill="#e2e8f0" />
    <polygon points="345,325 336,336 354,336" fill="#e2e8f0" />

    <!-- Pine Forest Silhouettes -->
    <g fill="#064e3b" opacity="0.95">
      <polygon points="100,375 106,360 112,375" />
      <polygon points="108,375 114,357 120,375" />
      <polygon points="116,375 122,362 128,375" />
      <polygon points="135,375 142,358 149,375" />
      <polygon points="350,375 357,358 364,375" />
      <polygon points="362,375 368,362 374,375" />
      <polygon points="372,375 378,356 384,375" />
      <polygon points="382,375 388,360 394,375" />
    </g>

    <!-- Centered Earth Globe -->
    <g transform="translate(250, 330)">
      <!-- Atmosphere Outer Halo -->
      <circle cx="0" cy="0" r="54" fill="#38bdf8" opacity="0.35" filter="url(#wg-glow)" />
      <!-- Globe Base Ocean Sphere -->
      <circle cx="0" cy="0" r="50" fill="url(#wg-earth-ocean)" />
      <!-- Earth Continents (Green/Emerald Landmasses) -->
      <path d="M -30 -20 Q -20 -35 -5 -32 Q 10 -35 22 -25 Q 35 -15 30 5 Q 20 25 5 28 Q -15 25 -32 5 Q -40 -10 -30 -20 Z"
            fill="#10b981" opacity="0.9" />
      <path d="M -15 -10 Q 5 -18 15 -8 Q 12 12 -5 18 Q -20 15 -15 -10 Z" fill="#059669" />
      <!-- Swirling White Atmospheric Weather Clouds on Globe -->
      <path d="M -45 -10 Q -25 -25 0 -18 Q 25 -10 45 -22" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85" />
      <path d="M -35 15 Q -10 5 15 20 Q 35 12 42 22" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- River Valley Stream in Foreground -->
    <path d="M 246 380 Q 250 365 248 350 Q 254 365 254 380 Z" fill="#38bdf8" filter="url(#wg-glow)" />

    <!-- ============================================== -->
    <!-- BOLD MONOGRAM "WG" WITH SWOOPING ORBITAL RING -->
    <!-- ============================================== -->
    <g transform="translate(250, 240)">
      <!-- Back Half of Orbital Cyan Ring (behind letters) -->
      <path d="M -165 15 C -150 -35 150 -55 165 -15"
            fill="none" stroke="url(#wg-orbit-grad)" stroke-width="12" stroke-linecap="round" opacity="0.6" />

      <!-- Shadow behind WG Letters for Maximum Contrast -->
      <!-- 'W' Shadow -->
      <path d="M -115 -60 L -80 35 L -52 -40 L -25 35 L 10 -60 L -12 -60 L -38 12 L -62 -45 L -72 -45 L -95 12 L -122 -60 Z"
            fill="#020617" opacity="0.95" transform="translate(3, 4)" />
      <!-- 'G' Shadow -->
      <path d="M 125 -60 L 5 -60 L -5 35 L 125 35 L 125 -8 L 60 -8 L 60 12 L 100 12 L 100 18 L 18 18 L 26 -40 L 125 -40 Z"
            fill="#020617" opacity="0.95" transform="translate(3, 4)" />

      <!-- BOLD 3D METALLIC 'W' -->
      <path d="M -115 -60 L -80 35 L -52 -40 L -25 35 L 10 -60 L -12 -60 L -38 12 L -62 -45 L -72 -45 L -95 12 L -122 -60 Z"
            fill="url(#wg-letter-grad)" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round" />
      <!-- Bevel / Highlight on W -->
      <path d="M -115 -60 L -80 35 L -70 35 L -98 -45 L -115 -60 Z" fill="#ffffff" opacity="0.75" />
      <path d="M -52 -40 L -25 35 L -16 35 L -42 -40 Z" fill="#ffffff" opacity="0.6" />

      <!-- BOLD 3D METALLIC 'G' -->
      <path d="M 125 -60 L 5 -60 L -5 35 L 125 35 L 125 -8 L 60 -8 L 60 12 L 100 12 L 100 18 L 18 18 L 26 -40 L 125 -40 Z"
            fill="url(#wg-letter-grad)" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round" />
      <!-- Bevel / Highlight on G -->
      <path d="M 125 -60 L 5 -60 L 10 -45 L 125 -45 Z" fill="#ffffff" opacity="0.8" />
      <path d="M -5 35 L 125 35 L 120 22 L 14 22 Z" fill="#94a3b8" opacity="0.5" />

      <!-- Front Half of Glowing Swooping Cyan Planetary Orbit Ring -->
      <path d="M -168 18 C -140 68 140 45 168 -12"
            fill="none" stroke="url(#wg-orbit-grad)" stroke-width="12" stroke-linecap="round" filter="url(#wg-glow)" />
      <!-- Core Bright Centerline of Ring -->
      <path d="M -165 18 C -140 66 140 43 165 -12"
            fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- ============================================== -->
  <!-- BOTTOM CURVED RIBBON BANNER "WEATHERGUARD" -->
  <!-- ============================================== -->
  <g transform="translate(0, 395)">
    <!-- Ribbon Shadow Base -->
    <path d="M 85 10 Q 250 55 415 10 L 405 52 Q 250 88 95 52 Z" fill="#030712" opacity="0.8" />

    <!-- Main Banner Ribbon Body -->
    <path d="M 85 5 Q 250 50 415 5 L 405 48 Q 250 85 95 48 Z"
          fill="url(#wg-ribbon-grad)" stroke="#0284c7" stroke-width="3" />

    <!-- Ribbon Accent Borders (Cyan Lines) -->
    <path d="M 98 12 Q 250 52 402 12" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.85" />
    <path d="M 105 42 Q 250 76 395 42" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.85" />

    <!-- Left / Right Ribbon Notch Tails -->
    <polygon points="85,5 70,26 87,46 95,48 85,5" fill="#071b38" stroke="#0284c7" stroke-width="2" />
    <polygon points="415,5 430,26 413,46 405,48 415,5" fill="#071b38" stroke="#0284c7" stroke-width="2" />

    <!-- Typography: "WEATHERGUARD" -->
    <!-- Left Dash & Right Dash -->
    <line x1="108" y1="31" x2="124" y2="33" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="376" y1="33" x2="392" y2="31" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Crisp Centered Text -->
    <text x="250" y="38" text-anchor="middle" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="25" font-weight="900" letter-spacing="3.5">
      <tspan fill="#ffffff">WEATHER</tspan><tspan fill="#22d3ee">GUARD</tspan>
    </text>
  </g>
</svg>
